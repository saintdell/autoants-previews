<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ============================================================
     AUTOANTS UNIVERSAL PREVIEW TEMPLATE — vertical-factory engine
     Content is driven by TWO injected config blocks:
       BIZ  = per-business facts (name, phone, city, rating…)  [verified public facts only]
       VERT = per-vertical content pack (services, copy, palette, urgency, trust…)
     scripts/build_site.py merges verticals/<vertical>.yaml + a lead's facts
     into this file. Same honesty gate as the hand-built sites: no fabricated
     reviews/claims; rating shown only when verified; unverifiable claims omitted.
     ============================================================ -->
<script>
/* INJECT:BIZ */
const BIZ = {
  "name": "Pipe Boss Plumbing",
  "phone": "(504) 877-2726",
  "phoneRaw": "+15048772726",
  "city": "Metairie",
  "serviceArea": "Metairie & Kenner",
  "rating": "5.0",
  "reviewCount": "160",
  "licensed": false
};
/* /INJECT:BIZ */
/* INJECT:VERT */
const VERT = {
  "regulatory_tier": 1,
  "label": "plumbing",
  "titleTail": "Plumbing, Drains & Water Heaters",
  "heroSub": "Emergency plumbing, drains & water heaters for {area}. Fast, upfront, no mess left behind.",
  "urgencyBar": "💧 Burst pipe or no hot water? We handle plumbing emergencies —",
  "urgencyCall": "Call now",
  "trustHeading": "Neighbors Trust Us",
  "quoteHeading": "Get a Quote in Under a Minute",
  "quoteLede": "Tell us what’s going on — we’ll call or text you back fast.",
  "quoteCta": "Send My Quote Request",
  "heroQuoteBtn": "Get a Fast Quote",
  "addrLabel": "Service address or neighborhood",
  "urgencyLabels": [
    "🚨 Emergency",
    "leak / no water",
    "🗓️ Standard",
    "quote for planned work"
  ],
  "palette": {
    "brand": "#14324f",
    "accent": "#1f9bd1",
    "brandDark": "#0e2338",
    "bg": "#f4f7f9",
    "ink": "#1b2733"
  },
  "services": [
    {
      "icon": "🚿",
      "title": "Leaks & Repairs",
      "blurb": "Dripping, running, or burst — we find it and fix it, and clean up after."
    },
    {
      "icon": "🌀",
      "title": "Drain Cleaning",
      "blurb": "Slow or clogged drains cleared, plus camera inspection for the recurring ones."
    },
    {
      "icon": "♨️",
      "title": "Water Heaters",
      "blurb": "Repair or replace — tank and tankless — with straight pricing."
    },
    {
      "icon": "🔩",
      "title": "Repiping & Fixtures",
      "blurb": "Faucets, toilets, and full repipes done right the first time."
    }
  ],
  "reviewThemes": [
    "Customers describe fast arrival on emergencies and upfront pricing before any work starts.",
    "Neighbors highlight clean, respectful work and a fix that actually held."
  ]
};
/* /INJECT:VERT */
</script>
<title>Business — Service | City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#1b4d2e; --accent:#e8842c; --brand-dark:#123420; --bg:#f6f4ee; --ink:#1f241c; --card:#fff; --muted:#5c6157; }
  @supports (color:color-mix(in srgb,red,black)){:root{--brand-dark:color-mix(in srgb,var(--brand) 68%,black)}}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  a{color:inherit}
  h1,h2,h3{font-family:Archivo,Inter,-apple-system,sans-serif}
  .storm-bar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 80%,black));color:#fff;text-align:center;padding:.6rem 1rem;font-weight:700;font-size:.95rem;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  @supports not (color:color-mix(in srgb,red,black)){.storm-bar{background:var(--accent)}}
  .storm-bar a{color:#fff;text-decoration:underline;text-underline-offset:3px}
  header{position:relative;overflow:hidden;color:#fff;padding:4rem 1.25rem 5.5rem;text-align:center;background:radial-gradient(90rem 40rem at 85% -20%,rgba(255,255,255,.10),transparent 60%),radial-gradient(60rem 30rem at 10% 110%,rgba(0,0,0,.35),transparent 60%),linear-gradient(170deg,var(--brand) 0%,var(--brand-dark) 78%)}
  header .treeline{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:54px;display:block;opacity:.5}
  header .badge-row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;position:relative}
  .badge{background:rgba(255,255,255,.12);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.35rem 1rem;font-size:.8rem;font-weight:700}
  header h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:900;line-height:1.08;margin-bottom:.9rem;text-shadow:0 2px 18px rgba(0,0,0,.35);position:relative}
  header p.sub{font-size:clamp(1.05rem,2.5vw,1.25rem);opacity:.94;max-width:36rem;margin:0 auto 2rem;position:relative}
  .cta-row{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;position:relative}
  .btn{display:inline-block;padding:1rem 1.8rem;border-radius:12px;font-weight:800;font-size:1.05rem;text-decoration:none;transition:transform .15s ease}
  .btn:active{transform:scale(.98)}
  .btn-call{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .btn-quote{background:rgba(255,255,255,.96);color:var(--brand-dark);box-shadow:0 8px 24px rgba(0,0,0,.25)}
  section{padding:3.5rem 1.25rem;max-width:64rem;margin:0 auto}
  h2{font-size:clamp(1.5rem,3.5vw,1.9rem);font-weight:800;color:var(--brand-dark);margin-bottom:.4rem;text-align:center}
  .rule{width:56px;height:4px;border-radius:2px;background:var(--accent);margin:0 auto 1.6rem}
  .services{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem}
  .svc{background:var(--card);border-radius:16px;padding:1.6rem 1.4rem;box-shadow:0 2px 14px rgba(30,40,25,.08);border-top:4px solid var(--brand);transition:transform .15s ease,box-shadow .15s ease}
  .svc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(30,40,25,.14)}
  .svc .chip{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:color-mix(in srgb,var(--brand) 12%,white);margin-bottom:.8rem}
  @supports not (color:color-mix(in srgb,red,black)){.svc .chip{background:#eef2ea}}
  .svc h3{margin:0 0 .35rem;font-size:1.12rem;color:var(--brand-dark)}
  .svc p{font-size:.93rem;color:var(--muted)}
  .quote-wrap{background:linear-gradient(160deg,var(--brand),var(--brand-dark));border-radius:22px;padding:2.5rem 1.6rem;color:#fff;box-shadow:0 18px 44px rgba(20,30,18,.28)}
  .quote-wrap h2{color:#fff}
  .quote-wrap p.lede{text-align:center;opacity:.92;margin-bottom:1.6rem}
  form{display:grid;gap:.9rem;max-width:29rem;margin:0 auto}
  label{font-size:.82rem;font-weight:700;letter-spacing:.03em}
  input,select,textarea{width:100%;padding:.9rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.25);font-size:1rem;font-family:inherit;background:rgba(255,255,255,.97)}
  input:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
  .urgency{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .urgency input{display:none}
  .urgency label{display:block;text-align:center;padding:.95rem .5rem;border-radius:12px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);cursor:pointer;font-size:.95rem}
  .urgency input:checked+label{background:var(--accent);border-color:var(--accent)}
  button[type=submit]{padding:1.1rem;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer}
  .quote-note{font-size:.82rem;text-align:center;opacity:.85;margin-top:.5rem}
  .quote-success{display:none;text-align:center;padding:2rem 1rem}
  .reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.1rem}
  .rev{background:var(--card);border-radius:16px;padding:1.5rem 1.4rem;box-shadow:0 2px 14px rgba(30,40,25,.08);font-size:.95rem;border-left:4px solid var(--accent)}
  .rev .stars{color:#eab308;letter-spacing:3px;font-size:1.05rem;margin-bottom:.4rem}
  .rev .who{margin-top:.7rem;font-weight:700;font-size:.83rem;color:var(--muted)}
  .rating-hero{text-align:center;background:var(--card);border-radius:18px;padding:2rem 1.5rem;box-shadow:0 2px 14px rgba(30,40,25,.08);margin-bottom:1.4rem}
  .rating-hero .big{font-size:2.6rem;font-weight:900;color:var(--brand-dark);font-family:Archivo,sans-serif;line-height:1}
  .rating-hero .stars{color:#eab308;letter-spacing:4px;font-size:1.3rem;margin:.35rem 0}
  .rating-hero .cnt{color:var(--muted);font-size:.95rem}
  .area-strip{text-align:center;background:var(--card);border-radius:18px;padding:2rem 1.5rem;box-shadow:0 2px 14px rgba(30,40,25,.08)}
  footer{position:relative;background:linear-gradient(180deg,var(--brand-dark),color-mix(in srgb,var(--brand-dark) 70%,black));color:#fff;text-align:center;padding:3rem 1.25rem 2.5rem;font-size:.9rem}
  @supports not (color:color-mix(in srgb,red,black)){footer{background:var(--brand-dark)}}
  footer .foot-call{font-size:1.45rem;font-weight:800;display:block;margin-bottom:.75rem;color:#fff;text-decoration:none}
  .float-call{display:none}
  @media(max-width:640px){.float-call{display:flex;position:fixed;bottom:1rem;left:1rem;right:1rem;z-index:60;background:var(--accent);color:#fff;border-radius:14px;padding:1.05rem;font-weight:800;font-size:1.1rem;justify-content:center;text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,.35)}body{padding-bottom:4.8rem}}
</style>
</head>
<body>
<div class="storm-bar" id="stormBar" hidden><span id="stormText"></span> <a data-tel href="#" id="stormCall">Call now</a></div>
<header>
  <div class="badge-row">
    <span class="badge" id="ratingBadge" hidden>⭐ <span data-rating></span> rating (<span data-reviews></span> reviews)</span>
    <span class="badge">📍 <span data-city></span>, LA</span>
  </div>
  <h1><span data-name></span></h1>
  <p class="sub" id="heroSub"></p>
  <div class="cta-row">
    <a class="btn btn-call" data-tel href="#">📞 Call <span data-phone></span></a>
    <a class="btn btn-quote" href="#quote" id="heroQuoteBtn">Get a Fast Quote →</a>
  </div>
  <svg class="treeline" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true"><path fill="rgba(0,0,0,.55)" d="M0,60 L0,40 C150,25 250,45 400,38 C560,30 640,50 800,42 C960,34 1050,50 1200,40 L1200,60 Z"/></svg>
</header>
<section>
  <h2>What We Do</h2><div class="rule"></div>
  <div class="services" id="services"></div>
</section>
<section id="quote">
  <div class="quote-wrap">
    <h2 id="quoteHeading"></h2><div class="rule"></div>
    <p class="lede" id="quoteLede"></p>
    <form id="quoteForm" onsubmit="return handleQuote(event)">
      <div class="urgency" id="urgencyToggle">
        <input type="radio" name="urgency" id="u1" value="priority"><label for="u1" id="u1l"></label>
        <input type="radio" name="urgency" id="u2" value="standard" checked><label for="u2" id="u2l"></label>
      </div>
      <div><label for="fname">Name</label><input id="fname" name="name" required autocomplete="name"></div>
      <div><label for="fphone">Phone</label><input id="fphone" name="phone" type="tel" required autocomplete="tel"></div>
      <div><label for="faddr" id="addrLabel">Address or neighborhood</label><input id="faddr" name="address" required></div>
      <div><label for="fdesc">What do you need?</label><textarea id="fdesc" name="desc" rows="3"></textarea></div>
      <button type="submit" id="quoteSubmit"></button>
      <p class="quote-note">Prefer to talk? <a data-tel href="#" style="color:#fff">Call <span data-phone></span></a>.</p>
    </form>
    <div class="quote-success" id="quoteSuccess"><h3>✅ Got it — we’re on it.</h3><p>Expect a call or text shortly.</p></div>
  </div>
</section>
<section>
  <h2 id="trustHeading"></h2><div class="rule"></div>
  <div class="rating-hero" id="ratingHero" hidden>
    <div class="big"><span data-rating></span> / 5</div><div class="stars">★★★★★</div>
    <div class="cnt">Rated across <span data-reviews></span> customer reviews</div>
  </div>
  <div class="reviews" id="reviews"></div>
  <!-- HONESTY: review cards paraphrase real public review themes; no fabricated verbatim quotes.
       Swap in the owner's real reviews (with permission) in the paid build. -->
</section>
<section><div class="area-strip"><h2>Service Area</h2><div class="rule"></div><p>Proudly serving <strong data-area></strong>.</p></div></section>
<footer>
  <a class="foot-call" data-tel href="#">📞 <span data-phone></span></a>
  <p><span data-name></span> · <span data-city></span>, Louisiana</p>
  <p style="margin-top:1rem;font-size:.75rem;opacity:.6">Site by AutoAnts</p>
</footer>
<a class="float-call" data-tel href="#">📞 Tap to Call — Free Quote</a>
<script>
  // ---- palette from VERT ----
  const p = VERT.palette || {};
  const rootStyle = document.documentElement.style;
  if(p.brand) rootStyle.setProperty('--brand', p.brand);
  if(p.accent) rootStyle.setProperty('--accent', p.accent);
  if(p.brandDark) rootStyle.setProperty('--brand-dark', p.brandDark);
  if(p.bg) rootStyle.setProperty('--bg', p.bg);
  if(p.ink) rootStyle.setProperty('--ink', p.ink);

  // ---- business facts ----
  const fill = (sel,val)=>document.querySelectorAll(sel).forEach(e=>e.textContent=val);
  fill('[data-name]',BIZ.name); fill('[data-phone]',BIZ.phone); fill('[data-city]',BIZ.city);
  fill('[data-area]',BIZ.serviceArea||BIZ.city);
  document.querySelectorAll('[data-tel]').forEach(e=>e.href='tel:'+BIZ.phoneRaw);
  document.title = BIZ.name + ' — ' + VERT.titleTail + ' | ' + BIZ.city + ', LA';
  if(BIZ.rating && BIZ.reviewCount){
    fill('[data-rating]',BIZ.rating); fill('[data-reviews]',BIZ.reviewCount);
    document.getElementById('ratingBadge').hidden=false;
    document.getElementById('ratingHero').hidden=false;
  }

  // ---- vertical content ----
  const tok = s => (s||'').replace('{area}',BIZ.serviceArea||BIZ.city).replace('{city}',BIZ.city);
  document.getElementById('heroSub').textContent = tok(VERT.heroSub);
  document.getElementById('heroQuoteBtn').textContent = (VERT.heroQuoteBtn||'Get a Fast Quote')+' →';
  document.getElementById('quoteHeading').textContent = VERT.quoteHeading||'Get a Quote';
  document.getElementById('quoteLede').textContent = tok(VERT.quoteLede||'');
  document.getElementById('quoteSubmit').textContent = VERT.quoteCta||'Send My Request';
  document.getElementById('trustHeading').textContent = VERT.trustHeading||'What People Say';
  const ul = VERT.urgencyLabels||['🚨 Now','urgent','🗓️ Planned','a quote'];
  document.getElementById('u1l').innerHTML = ul[0]+'<br><small>'+ul[1]+'</small>';
  document.getElementById('u2l').innerHTML = ul[2]+'<br><small>'+ul[3]+'</small>';
  if(VERT.addrLabel) document.getElementById('addrLabel').textContent = VERT.addrLabel;
  // urgency bar (emergency verticals only)
  if(VERT.urgencyBar){
    document.getElementById('stormText').textContent = VERT.urgencyBar;
    document.getElementById('stormCall').textContent = VERT.urgencyCall||'Call now';
    document.getElementById('stormBar').hidden=false;
  }
  // services
  document.getElementById('services').innerHTML = (VERT.services||[]).map(s=>
    '<div class="svc"><div class="chip">'+s.icon+'</div><h3>'+s.title+'</h3><p>'+s.blurb+'</p></div>').join('');
  // review theme cards (honest paraphrase; only if provided)
  document.getElementById('reviews').innerHTML = (VERT.reviewThemes||[]).map(t=>
    '<div class="rev"><div class="stars">★★★★★</div><p>'+t+'</p><div class="who">— summarized from public reviews</div></div>').join('');

  function handleQuote(ev){ev.preventDefault();document.getElementById('quoteForm').style.display='none';document.getElementById('quoteSuccess').style.display='block';return false;}
</script>
</body>
</html>
